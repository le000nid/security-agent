services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  agent:
    profiles: ["agent"]
    build: .
    image: ${AGENT_IMAGE:-ai-security-agent:0.3.2}
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      juice-shop:
        condition: service_healthy
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_MAX_PLANNER_CALLS: ${AGENT_MAX_PLANNER_CALLS:-8}
      LLM_ENRICHMENT_BATCH_SIZE: ${LLM_ENRICHMENT_BATCH_SIZE:-1}
      LLM_ENRICHMENT_MAX_TOKENS: ${LLM_ENRICHMENT_MAX_TOKENS:-1200}
      LLM_ENRICHMENT_RETRY_MAX_TOKENS: ${LLM_ENRICHMENT_RETRY_MAX_TOKENS:-2200}
      LLM_BRIEF_ENABLED: ${LLM_BRIEF_ENABLED:-true}
      LLM_BRIEF_MAX_TOKENS: ${LLM_BRIEF_MAX_TOKENS:-1000}
      LLM_BRIEF_RETRY_MAX_TOKENS: ${LLM_BRIEF_RETRY_MAX_TOKENS:-1600}
      LLM_REPORT_TONE: ${LLM_REPORT_TONE:-professional}
      LLM_REPORT_LANGUAGE: ${LLM_REPORT_LANGUAGE:-ru}
    volumes:
      - ./logs:/agent/logs
      - ./reports:/agent/reports
      - ./runs:/agent/runs
      - ./targets:/targets:ro
