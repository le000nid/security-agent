[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-agent"
version = "0.3.2"
description = "Local-only educational security testing harness for OWASP Juice Shop"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "rich>=13.0,<15.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
security-agent = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "benchmark*"]

[tool.setuptools.data-files]
"share/ai-security-agent/config" = ["config/semgrep.yaml"]
"share/ai-security-agent/config/nuclei" = ["config/nuclei/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
