[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-agent"
version = "0.2.2"
description = "Local-only educational security testing harness for OWASP Juice Shop"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "rich>=13.0,<15.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
