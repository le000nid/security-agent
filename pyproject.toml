[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-agent"
version = "0.4.0"
description = "Local educational AI-assisted application security analysis platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "rich>=13.0,<15.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
]

[project.scripts]
security-agent = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "benchmark*"]

[tool.setuptools.data-files]
"share/ai-security-agent/config" = ["config/semgrep.yaml", "config/benchmarks.yaml"]
"share/ai-security-agent/config/expected" = ["config/expected/*.json"]
"share/ai-security-agent/config/nuclei" = ["config/nuclei/*.yaml"]

[tool.setuptools.package-data]
app = ["ui/templates/*.html", "ui/static/*.css", "ui/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
