id: local-http-cookie-missing-httponly
info:
  name: Cookie response lacks HttpOnly indicator
  author: ai-security-agent
  severity: low
  tags: headers,cookies,configuration
  description: A Set-Cookie header exists but the response headers do not include an HttpOnly attribute.
  remediation: Add HttpOnly to session cookies that do not require JavaScript access.
http:
  - method: GET
    path: ["{{BaseURL}}"]
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - "contains(to_lower(all_headers), 'set-cookie:') && !contains(to_lower(all_headers), 'httponly')"
