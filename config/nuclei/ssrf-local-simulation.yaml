id: ssrf-local-simulation
info:
  name: SSRF lab local marker disclosure
  author: security-agent
  severity: medium
  tags: ssrf,simulation
  description: Deterministic local simulation; no arbitrary URL or cloud metadata request is performed.
  remediation: Map user choices to fixed allowlisted destinations and reject arbitrary URLs.
http:
  - method: GET
    path:
      - "{{BaseURL}}/ssrf/fetch?resource=internal"
      - "{{BaseURL}}/ssrf/safe?resource=internal"
    redirects: false
    req-condition: true
    matchers:
      - type: dsl
        name: local-simulation-differential
        dsl:
          - >-
            status_code_1 == 200 && status_code_2 == 200 &&
            contains(header_1, 'local-simulation-v1') &&
            contains(body_1, 'SSRF_LAB_INTERNAL_4f12') &&
            !contains(body_2, 'SSRF_LAB_INTERNAL_4f12')
