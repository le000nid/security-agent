- id: sample-sast
  name: Sample SAST
  description: Curated Python and JavaScript source fixtures; nine expected Semgrep findings.
  description_ru: Учебные исходники Python и JavaScript с девятью ожидаемыми находками Semgrep. Только SAST, без HTTP-сервиса.
  capabilities: [sast]
  source_path: /targets/sample-app
  expected_findings: sample-sast.json
  tags: [educational, source-only]
- id: juice-shop
  name: OWASP Juice Shop
  description: Local HTTP training target; matching source is not bundled. DAST only.
  description_ru: Локальный HTTP-стенд OWASP Juice Shop. Исходники этого приложения не включены; доступен только DAST.
  capabilities: [dast]
  target_url: http://juice-shop:3000
  docker_service: juice-shop
  tags: [educational, http]
- id: demo-full
  name: Demo Full
  description: Same-project source and HTTP service with safe, deterministic configuration indicators.
  description_ru: Исходники и HTTP-сервис одного учебного проекта. FULL объединяет SAST и DAST; ожидаются четыре находки в коде и три в HTTP-конфигурации.
  capabilities: [sast, dast]
  source_path: /targets/demo-full
  target_url: http://demo-full:3000
  docker_service: demo-full
  expected_findings: demo-full.json
  tags: [educational, same-application, curated]

- id: nosqli-sast
  name: NoSQLi SAST fixtures
  description: Source-only JavaScript fixtures for user-controlled $where expressions.
  description_ru: Учебные примеры для SAST; два опасных запроса и два безопасных контрольных примера.
  capabilities: [sast]
  source_path: /targets/nosqli
  tags: [educational, source-only, nosqli]

- id: nosqli-dast
  name: Juice Shop NoSQLi lab
  description: Separate local Juice Shop instance with safety mode disabled for training.
  description_ru: Отдельный учебный Juice Shop с отключённым защитным режимом. Проверка NoSQLi в отзывах.
  capabilities: [dast]
  target_url: http://nosqli-lab:3000
  docker_service: nosqli-lab
  tags: [educational, http, nosqli]

- id: nosqli-mongo-full
  name: NoSQLi MongoDB API
  description: Same-application MongoDB benchmark with three read-only injection scenarios and safe counterparts.
  description_ru: API с настоящей MongoDB. Три уязвимых сценария и безопасные пары; SAST и DAST проверяют одно приложение.
  capabilities: [sast, dast]
  source_path: /targets/nosqli-lab/src
  target_url: http://nosqli-mongo-api:3000
  docker_service: nosqli-mongo-api
  expected_findings: nosqli-mongo-full.json
  tags: [educational, same-application, nosqli, mongodb]

- id: nosqli-profile-catalog
  name: NoSQLi profiles - catalog
  description: Configurable scalar operator probe against the original MongoDB API.
  description_ru: Переносимая проверка оператора на первом API. Ожидается одна находка.
  capabilities: [dast]
  target_url: http://nosqli-mongo-api:3000
  docker_service: nosqli-mongo-api
  nosqli_profiles: [catalog-operator]
  tags: [educational, nosqli, profiles]
- id: nosqli-profile-catalog-safe
  name: NoSQLi profiles - catalog control
  description: The same contract against the validated scalar endpoint; no finding expected.
  description_ru: Безопасная пара первого API. Оператор должен быть отклонён.
  capabilities: [dast]
  target_url: http://nosqli-mongo-api:3000
  docker_service: nosqli-mongo-api
  nosqli_profiles: [catalog-operator-safe]
  tags: [educational, nosqli, profiles, control]
- id: nosqli-profile-inventory
  name: NoSQLi profiles - inventory
  description: POST and GET probes against a second MongoDB API with nested input and response fields.
  description_ru: Второй API с другими полями и ответом. Проверки POST и GET; ожидаются две находки.
  capabilities: [dast]
  target_url: http://nosqli-portable-api:3000
  docker_service: nosqli-portable-api
  nosqli_profiles: [inventory-post, inventory-get]
  tags: [educational, nosqli, profiles, mongodb]
- id: nosqli-profile-inventory-safe
  name: NoSQLi profiles - inventory controls
  description: POST and GET against scalar-validated inventory routes; no finding expected.
  description_ru: Безопасные пары второго API для POST и GET. Находок не ожидается.
  capabilities: [dast]
  target_url: http://nosqli-portable-api:3000
  docker_service: nosqli-portable-api
  nosqli_profiles: [inventory-post-safe, inventory-get-safe]
  tags: [educational, nosqli, profiles, control]
