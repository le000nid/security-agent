rules:
  - id: python-debug-enabled
    languages: [python]
    severity: WARNING
    message: Debug mode should be disabled outside the local development environment.
    pattern: $APP.run(..., debug=True, ...)
    metadata:
      category: configuration
      confidence: HIGH
      recommendation: Disable debug mode outside local development.
  - id: python-subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: A subprocess call enables shell parsing and requires manual review.
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(run|call|check_call|check_output|Popen)$
    metadata:
      category: command-execution
      confidence: HIGH
      recommendation: Pass an argument list without shell=True whenever possible.
  - id: python-unsafe-pickle-deserialization
    languages: [python]
    severity: ERROR
    message: Pickle deserialization can execute code when input is untrusted.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
    metadata:
      category: deserialization
      confidence: HIGH
      recommendation: Use a non-executable serialization format for untrusted data.
  - id: python-obvious-hardcoded-secret
    languages: [python]
    severity: WARNING
    message: An obvious secret-like variable is assigned a literal string.
    patterns:
      - pattern: $KEY = $VALUE
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(api_key|secret_key|access_token|auth_token|password)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^["'][^"']{8,}["']$
    metadata:
      category: secrets
      confidence: MEDIUM
      recommendation: Load credentials from an approved secret store or runtime environment.
  - id: python-tls-verification-disabled
    languages: [python]
    severity: WARNING
    message: A requests call explicitly disables TLS certificate verification.
    pattern: requests.$METHOD(..., verify=False, ...)
    metadata:
      category: transport-security
      confidence: HIGH
      recommendation: Keep certificate verification enabled and configure trusted certificates.
  - id: javascript-tls-verification-disabled
    languages: [javascript, typescript]
    severity: WARNING
    message: Enable TLS certificate verification.
    pattern: "{..., rejectUnauthorized: false, ...}"
    metadata:
      category: configuration
      confidence: HIGH
      recommendation: Keep TLS certificate validation enabled.
  - id: javascript-obvious-hardcoded-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: An obvious secret-like variable is assigned a literal string.
    patterns:
      - pattern-either:
          - pattern: const $KEY = $VALUE
          - pattern: let $KEY = $VALUE
          - pattern: var $KEY = $VALUE
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(apiKey|secretKey|accessToken|authToken|password)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^["'`][^"'`]{8,}["'`]$
    metadata:
      category: secrets
      confidence: MEDIUM
      recommendation: Load credentials from an approved secret store or runtime environment.
  - id: javascript-child-process-exec
    languages: [javascript, typescript]
    severity: WARNING
    message: A child_process command execution call requires manual input-safety review.
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
    metadata:
      category: command-execution
      confidence: MEDIUM
      recommendation: Prefer argument-based process APIs and validate all untrusted input.
  - id: javascript-eval-usage
    languages: [javascript, typescript]
    severity: WARNING
    message: Runtime evaluation of a string requires manual review.
    pattern: eval(...)
    metadata:
      category: code-injection
      confidence: HIGH
      recommendation: Replace eval with explicit parsing or direct application logic.

  - id: javascript-nosqli-tainted-where
    languages: [javascript, typescript]
    severity: WARNING
    message: User-controlled input reaches a NoSQL $where expression.
    mode: taint
    pattern-sources:
      - pattern: $REQ.params.$FIELD
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.body.$FIELD
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  $COLLECTION.find({..., $where: $QUERY, ...}, ...)
              - pattern: |
                  $COLLECTION.findOne({..., $where: $QUERY, ...}, ...)
          - focus-metavariable: $QUERY
    metadata:
      category: injection
      confidence: MEDIUM
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      recommendation: Validate input types and use field-based filters instead of constructing $where expressions.

  - id: javascript-nosqli-scalar-operator
    languages: [javascript, typescript]
    severity: WARNING
    message: Untrusted input reaches a MongoDB filter field without scalar conversion; review whether operator objects are accepted.
    mode: taint
    pattern-sources:
      - pattern: $REQ.body.$FIELD
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.params.$FIELD
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  $COLLECTION.find({..., $KEY: $VALUE, ...}, ...)
              - pattern: |
                  $COLLECTION.findOne({..., $KEY: $VALUE, ...}, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: '^[a-zA-Z_][a-zA-Z0-9_]*$'
          - focus-metavariable: $VALUE
    metadata:
      category: injection
      confidence: MEDIUM
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      recommendation: Enforce the expected scalar type and construct a field-based filter. Do not accept operator objects for scalar inputs.

  - id: javascript-nosqli-untrusted-filter
    languages: [javascript, typescript]
    severity: WARNING
    message: A user-supplied filter reaches a MongoDB query; review allowed operators and preservation of server-owned scope.
    mode: taint
    pattern-sources:
      - pattern: $REQ.body.filter
      - pattern: $REQ.query.filter
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $COLLECTION.find($FILTER, ...)
              - pattern: $COLLECTION.findOne($FILTER, ...)
          - focus-metavariable: $FILTER
    metadata:
      category: injection
      confidence: MEDIUM
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      recommendation: Allowlist fields, reject operator objects and construct a fresh filter. Keep authorization scope server-owned.
