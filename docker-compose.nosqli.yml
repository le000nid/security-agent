services:
  nosqli-lab:
    image: bkimminich/juice-shop:v20.2.0
    environment:
      NODE_CONFIG: '{"challenges":{"safetyMode":"disabled"}}'
    ports:
      - "127.0.0.1:3004:3000"

  nosqli-mongo:
    image: mongo:8.0.17
    profiles: [nosqli-mongo]
    command: ["mongod", "--bind_ip_all", "--quiet"]
    networks: [nosqli-db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  nosqli-mongo-api:
    profiles: [nosqli-mongo]
    build: ./targets/nosqli-lab
    image: security-agent-nosqli-lab:1.0.0
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MONGODB_URI: mongodb://nosqli-mongo:27017
    networks: [default, nosqli-db]
    ports: ["127.0.0.1:3005:3000"]
    depends_on:
      nosqli-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  nosqli-mongo-tests:
    profiles: [nosqli-tests]
    image: security-agent-nosqli-lab:1.0.0
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MONGO_TEST_URI: mongodb://nosqli-mongo:27017
      NOSQLI_SCENARIOS: /lab/scenarios.json
    volumes:
      - ./targets/nosqli-lab/test:/lab/test:ro
      - ./config/nosqli-scenarios.json:/lab/scenarios.json:ro
    networks: [nosqli-db]
    depends_on:
      nosqli-mongo:
        condition: service_healthy
    command: ["node", "--test", "test/validation.test.js", "test/mongodb.test.js"]

networks:
  nosqli-db:
    internal: true
