name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ai-security-agent:0.4.1
          cache-from: type=gha
      - name: Scanner-only lab smoke
        run: |
          mkdir -p runs logs reports
          export AGENT_UID=$(id -u) AGENT_GID=$(id -g)
          docker compose up -d --wait --wait-timeout 180 juice-shop demo-full
          docker compose --profile agent run --rm --no-deps agent scan --benchmark demo-full --mode full --no-llm
          docker compose --profile agent run --rm --no-deps --entrypoint python agent -m benchmark.verify_run
          docker compose --profile agent run --rm --no-deps agent scan --benchmark sast-contours --mode sast --no-llm
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("runs/latest.json").read_text(encoding="utf-8"))
          summary_path = Path("runs") / latest["run_id"] / "reports" / "summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          evaluation = summary["benchmark_evaluation"]

          assert evaluation["expected_count"] == 6, evaluation
          assert evaluation["detected_expected_count"] == 6, evaluation
          assert evaluation["missed_findings"] == [], evaluation
          assert evaluation["unexpected_findings"] == [], evaluation
          assert evaluation["precision"] == 1.0, evaluation
          assert evaluation["recall"] == 1.0, evaluation
          print("sast-contours benchmark passed: 6/6 expected, 0 unexpected")
          PY
          docker compose --profile ui up -d --wait --wait-timeout 180 ui
          curl --fail http://127.0.0.1:8080/healthz
      - name: SQLi hardening regression
        timeout-minutes: 5
        run: |
          mkdir -p logs
          docker compose --profile agent run --rm --no-deps --entrypoint semgrep agent scan \
            --config /agent/config/semgrep.yaml \
            --metrics=off --disable-version-check --strict --json \
            /targets/sast-sqli-hardening > logs/sqli-hardening.json
          python -m benchmark.verify_sqli_hardening logs/sqli-hardening.json
      - name: SQLi variation regression
        timeout-minutes: 5
        run: |
          mkdir -p logs
          docker compose --profile agent run --rm --no-deps --entrypoint semgrep agent scan \
            --config /agent/config/semgrep.yaml \
            --metrics=off --disable-version-check --strict --json \
            /targets/sast-sqli-variants > logs/sqli-variants.json
          python -m benchmark.verify_sqli_variants logs/sqli-variants.json
      - name: LFI variation regression
        timeout-minutes: 5
        run: |
          mkdir -p logs
          docker compose --profile agent run --rm --no-deps --entrypoint semgrep agent scan \
            --config /agent/config/semgrep.yaml \
            --metrics=off --disable-version-check --strict --json \
            /targets/sast-lfi-variants > logs/lfi-variants.json
          python -m benchmark.verify_lfi_variants logs/lfi-variants.json
      - name: RFI variation regression
        timeout-minutes: 5
        run: |
          mkdir -p logs
          docker compose --profile agent run --rm --no-deps --entrypoint semgrep agent scan \
            --config /agent/config/semgrep.yaml \
            --metrics=off --disable-version-check --strict --json \
            /targets/sast-rfi-variants > logs/rfi-variants.json
          python -m benchmark.verify_rfi_variants logs/rfi-variants.json
      - name: SAST scanner output contract
        timeout-minutes: 5
        run: docker compose --profile agent run --rm --no-deps --entrypoint python agent -m benchmark.verify_sast_contract
      - if: always()
        run: docker compose --profile ui --profile agent down
