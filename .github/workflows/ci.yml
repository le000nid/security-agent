name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Use the Intel pool while hosted macOS arm64 jobs are failing to start.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-26-intel' || matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ai-security-agent:0.4.1
          cache-from: type=gha
      - name: SAST regression acceptance
        timeout-minutes: 10
        run: |
          mkdir -p runs logs reports
          export AGENT_UID=$(id -u) AGENT_GID=$(id -g)
          docker compose --profile agent run --rm --no-deps --entrypoint python agent \
            -m benchmark.verify_sast_regressions --output-dir /agent/logs/sast-regression
          docker compose --profile agent run --rm --no-deps --entrypoint python agent \
            -m benchmark.verify_vega_p2_sast
      - name: Upload SAST regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-regression-reports
          path: logs/sast-regression/
          if-no-files-found: ignore
          retention-days: 7
      - name: Scanner-only lab smoke
        run: |
          mkdir -p runs logs reports
          export AGENT_UID=$(id -u) AGENT_GID=$(id -g)
          docker compose up -d --wait --wait-timeout 180 juice-shop demo-full
          docker compose --profile agent run --rm --no-deps agent scan --benchmark demo-full --mode full --no-llm
          docker compose --profile agent run --rm --no-deps --entrypoint python agent -m benchmark.verify_run
          docker compose --profile ui up -d --wait --wait-timeout 180 ui
          curl --fail http://127.0.0.1:8080/healthz
      - if: always()
        run: docker compose --profile ui --profile agent down
